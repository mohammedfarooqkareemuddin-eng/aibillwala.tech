<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI BillWala - Smart Invoice Generator</title>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .header p {
            color: #4a5568;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 30px;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .filter-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #2a5298;
            color: white;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            align-items: center;
        }
        .action-row button {
            width: auto;
            padding: 10px 20px;
            font-size: 0.9rem;
        }
        .upload-btn {
            background: #2a5298 !important;
        }
        .camera-btn {
            background: #25D366 !important;
        }
        .main-btn {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2);
        }
        .main-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .invoice-preview {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }
        .invoice-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #cbd5e1;
        }
        .invoice-title h2 {
            color: #1e3c72;
            font-size: 1.5rem;
        }
        .invoice-meta p {
            margin: 4px 0;
            color: #475569;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #eef2ff;
            color: #1e3c72;
        }
        .totals {
            text-align: right;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #cbd5e1;
        }
        .error-box {
            background: #fee2e2;
            border-left: 5px solid #ef4444;
            padding: 15px;
            border-radius: 12px;
            color: #991b1b;
            margin-top: 20px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .action-buttons button {
            width: auto;
            padding: 10px 20px;
            background: #2a5298;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
        }
        .whatsapp-btn {
            background: #25D366;
            display: inline-block;
            text-align: center;
            margin-top: 16px;
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 40px;
        }
        .footer {
            text-align: center;
            color: #6c757d;
            font-size: 0.8rem;
            margin-top: 30px;
        }
        @media (max-width: 640px) {
            .invoice-header {
                flex-direction: column;
                align-items: start;
                gap: 10px;
            }
            .invoice-meta {
                text-align: left;
            }
            th, td {
                font-size: 0.85rem;
                padding: 8px 4px;
            }
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                margin: 0;
                padding: 20px;
                background: white;
            }
            .action-buttons, .main-btn, .filter-group, .input-group, .action-row, .video-container, .contact-form, .footer, .header {
                display: none !important;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧾 AI BillWala</h1>
        <p>Describe your work, upload a file, or take a photo → instant invoice</p>
    </div>

    <div class="card">
        <div class="filter-group" id="filterGroup">
            <button class="filter-btn" data-category="medical">🏥 Medical</button>
            <button class="filter-btn" data-category="grocery">🛒 Grocery</button>
            <button class="filter-btn" data-category="transportation">🚗 Transportation</button>
            <button class="filter-btn" data-category="accounts">💰 Accounts</button>
        </div>

        <div class="input-group">
            <label>📝 Invoice description (or paste text)</label>
            <textarea id="promptInput" rows="4" placeholder="Example: Xray 2 units at Rs 500, MRI 1 at Rs 3000..."></textarea>
        </div>

        <!-- NEW: Upload & Camera Buttons -->
        <div class="action-row">
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt" style="display:none;">
            <button id="uploadBtn" class="upload-btn">📎 Upload Excel/TXT</button>

            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
            <button id="cameraBtn" class="camera-btn">📷 Take Photo</button>

            <span id="fileName" style="color:#4a5568; font-size:0.9rem;"></span>
        </div>

        <button id="generateBtn" class="main-btn">✨ Generate Invoice</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <div class="invoice-preview" id="invoiceContent"></div>
        <div class="action-buttons" id="actionButtons" style="display: none;">
            <button id="printBtn">🖨️ Print / Save as PDF</button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 16px;">📺 How AI BillWala works</h3>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/PLACEHOLDER" title="AI BillWala intro" frameborder="0" allowfullscreen></iframe>
        </div>
        <p style="color: #4a5568;">Replace the video ID later – just edit the iframe `src`.</p>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 16px;">📬 Contact us</h3>
        <div class="contact-form" id="contactForm">
            <input type="text" id="contactName" placeholder="Your name" required>
            <input type="email" id="contactEmail" placeholder="Email address" required>
            <textarea id="contactMessage" rows="3" placeholder="Your message..."></textarea>
            <button id="sendContactBtn" style="background: #1e3c72;">Send message</button>
            <a href="https://wa.me/919876543210?text=Hello%20AI%20BillWala" target="_blank" class="whatsapp-btn">📱 Chat on WhatsApp</a>
        </div>
        <div id="contactStatus" style="margin-top: 12px; font-size: 0.8rem;"></div>
    </div>

    <div class="footer">
        AI BillWala • Smart invoicing • Professional invoice generator
    </div>
</div>

<script>
    // 🔴 REPLACE WITH YOUR CLOUDFLARE WORKER URL
    const BACKEND_URL = 'https://winter-rice-e360.mohammedfarooqkareemuddin.workers.dev';

    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const invoiceContent = document.getElementById('invoiceContent');
    const actionButtons = document.getElementById('actionButtons');
    const fileNameSpan = document.getElementById('fileName');

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cat = btn.dataset.category;
            let template = '';
            if (cat === 'medical') template = 'Xray 2 units at Rs 500\nMRI 1 unit at Rs 3000\nBed charges 3 days at Rs 2000/day\nMedicine 10 tablets at Rs 15';
            else if (cat === 'grocery') template = 'Rice 5 kg at Rs 60/kg\nMilk 10 litres at Rs 55/litre\nVegetables 3 kg at Rs 40/kg';
            else if (cat === 'transportation') template = 'Taxi 20 km at Rs 15/km\nMetro pass 2 trips at Rs 50 each';
            else if (cat === 'accounts') template = 'Audit services 4 hours at Rs 1200/hr\nTax filing 1 service at Rs 2500';
            promptInput.value = template;
        });
    });

    // 📎 Upload file button
    document.getElementById('uploadBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileNameSpan.textContent = '📎 ' + file.name;
        let text = '';
        if (file.name.match(/\.(xlsx|xls)$/)) {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data);
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            text = json.map(row => row.filter(c => c).join(' ')).join('\n');
        } else {
            text = await file.text();
        }
        promptInput.value = text;
    });

    // 📷 Camera button
    document.getElementById('cameraBtn').addEventListener('click', () => {
        document.getElementById('cameraInput').click();
    });

    document.getElementById('cameraInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileNameSpan.textContent = '📷 Photo captured';
        // Load Tesseract.js on demand
        if (!window.Tesseract) {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
            script.onload = async () => {
                const result = await Tesseract.recognize(file, 'eng');
                promptInput.value = result.data.text;
            };
            document.head.appendChild(script);
        } else {
            const result = await Tesseract.recognize(file, 'eng');
            promptInput.value = result.data.text;
        }
    });

    // Generate invoice
    generateBtn.addEventListener('click', async () => {
        const prompt = promptInput.value.trim();
        if (!prompt) { alert('Please enter a description, upload a file, or take a photo.'); return; }
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<span class="loader"></span> Generating...';
        resultCard.style.display = 'none';
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            const data = await response.json();
            if (data.success && data.data) { displayInvoice(data.data); actionButtons.style.display = 'flex'; }
            else { showError(data.error || 'Generation failed'); actionButtons.style.display = 'none'; }
        } catch (err) {
            if (err.name === 'AbortError') {
                showError('⏱️ Timeout: Apps Script took too long. Too many items?');
            } else {
                showError('Network error: ' + err.message);
            }
            actionButtons.style.display = 'none';
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerHTML = '✨ Generate Invoice';
        }
    });

    function displayInvoice(inv) {
        const formatMoney = (amt) => `₹${(amt || 0).toLocaleString('en-IN')}`;
        let itemsHtml = '';
        if (inv.items && inv.items.length) {
            inv.items.forEach(item => {
                itemsHtml += `<tr>
                    <td>${escapeHtml(item.description || '')}</td>
                    <td style="text-align:center">${item.hours || 0}</td>
                    <td style="text-align:right">${formatMoney(item.rate)}</td>
                    <td style="text-align:right">${formatMoney(item.total)}</td>
                </tr>`;
            });
        } else { itemsHtml = '<tr><td colspan="4">No items</td></tr>'; }
        const html = `
            <div id="printArea">
                <div class="invoice-header">
                    <div class="invoice-title"><h2>INVOICE</h2></div>
                    <div class="invoice-meta">
                        <p><strong>Invoice #:</strong> ${escapeHtml(inv.invoiceNumber)}</p>
                        <p><strong>Date:</strong> ${escapeHtml(inv.date)}</p>
                        <p><strong>Client:</strong> ${escapeHtml(inv.clientName)}</p>
                    </div>
                </div>
                <table>
                    <thead><tr><th>Description</th><th>Units</th><th>Rate</th><th>Total</th></tr></thead>
                    <tbody>${itemsHtml}</tbody>
                </table>
                <div class="totals">
                    <p><strong>Subtotal:</strong> ${formatMoney(inv.subtotal)}</p>
                    <p><strong>Tax (GST):</strong> ${formatMoney(inv.tax)}</p>
                    <p style="font-size:1.3rem"><strong>Total Due:</strong> ${formatMoney(inv.amountDue || inv.total)}</p>
                </div>
                <p style="text-align:center; margin-top:20px;">Thank you for your business!</p>
            </div>`;
        invoiceContent.innerHTML = html;
        resultCard.style.display = 'block';
        document.getElementById('printBtn').onclick = () => window.print();
    }

    function showError(msg) {
        invoiceContent.innerHTML = `<div class="error-box">⚠️ ${escapeHtml(msg)}</div>`;
        resultCard.style.display = 'block';
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Contact form (demo)
    document.getElementById('sendContactBtn').addEventListener('click', () => {
        const name = document.getElementById('contactName').value.trim();
        const email = document.getElementById('contactEmail').value.trim();
        const msg = document.getElementById('contactMessage').value.trim();
        if (!name || !email || !msg) { document.getElementById('contactStatus').innerText = '❌ Please fill all fields.'; return; }
        document.getElementById('contactStatus').innerHTML = '✅ Message sent! We will reply soon.';
        document.getElementById('contactName').value = ''; document.getElementById('contactEmail').value = ''; document.getElementById('contactMessage').value = '';
        setTimeout(() => document.getElementById('contactStatus').innerText = '', 3000);
    });
</script>
</body>
</html>
